<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2001 Census Dissemination Areas — Population, Toronto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  #map { width: 100%; height: 100%; }
  .legend {
    background: white;
    padding: 8px 10px;
    line-height: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
  }
  .legend i {
    width: 16px;
    height: 16px;
    float: left;
    margin-right: 6px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="da_2001_data.js"></script>
<script>
  const map = L.map('map').setView([43.715, -79.38], 11);

  // NRCan Canada Base Map - Transportation (CBMT), EPSG:3857
  L.tileLayer(
    'https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_CBCT_GEOM_3857/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Canada Base Map &copy; Natural Resources Canada', maxZoom: 17 }
  ).addTo(map);

  L.tileLayer(
    'https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_TXT_3857/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 17 }
  ).addTo(map);

  // Population choropleth color scale
  function getColor(pop) {
    return pop > 3000 ? '#800026' :
           pop > 2000 ? '#BD0026' :
           pop > 1500 ? '#E31A1C' :
           pop > 1000 ? '#FC4E2A' :
           pop > 500  ? '#FD8D3C' :
           pop > 250  ? '#FEB24C' :
           pop > 0    ? '#FED976' :
                        '#FFEDA0';
  }

  function style(feature) {
    return {
      fillColor: getColor(Number(feature.properties.pop)),
      weight: 1,
      opacity: 1,
      color: '#555',
      fillOpacity: 0.7
    };
  }

  function onEachFeature(feature, layer) {
    const props = feature.properties;
    layer.bindPopup(`<b>DA ${props.id}</b><br>Population (2001): ${props.pop}`);
  }

  L.geoJSON(daData2001, {
    style: style,
    onEachFeature: onEachFeature
  }).addTo(map);

  // Legend
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    const grades = [0, 250, 500, 1000, 1500, 2000, 3000];
    div.innerHTML = '<b>Population (2001)</b><br>';
    for (let i = 0; i < grades.length; i++) {
      const from = grades[i];
      const to = grades[i + 1];
      div.innerHTML +=
        '<i style="background:' + getColor(from + 1) + '"></i> ' +
        from + (to ? '&ndash;' + to : '+') + '<br>';
    }
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>
