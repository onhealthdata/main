<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontario Health Atlas – Coming Soon</title>
<meta name="description" content="A geographic reference for population health across Ontario. Coming soon.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="bg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1600 900" aria-hidden="true">
  <!-- graticule -->
  <g>
    <line class="grid-line" x1="0" y1="150" x2="1600" y2="150"/>
    <line class="grid-line" x1="0" y1="300" x2="1600" y2="300"/>
    <line class="grid-line" x1="0" y1="450" x2="1600" y2="450"/>
    <line class="grid-line" x1="0" y1="600" x2="1600" y2="600"/>
    <line class="grid-line" x1="0" y1="750" x2="1600" y2="750"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="900"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="900"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="900"/>
    <line class="grid-line" x1="800" y1="0" x2="800" y2="900"/>
    <line class="grid-line" x1="1000" y1="0" x2="1000" y2="900"/>
    <line class="grid-line" x1="1200" y1="0" x2="1200" y2="900"/>
    <line class="grid-line" x1="1400" y1="0" x2="1400" y2="900"/>
    <text class="grid-label" x="210" y="145">60°N</text>
    <text class="grid-label" x="210" y="445">50°N</text>
    <text class="grid-label" x="210" y="745">40°N</text>
    <text class="grid-label" x="610" y="30">90°W</text>
    <text class="grid-label" x="1010" y="30">80°W</text>
    <text class="grid-label" x="1410" y="30">70°W</text>
  </g>
</svg>

<main class="stage">

  <h1>Ontario Health Atlas</h1>

  <div class="index">
    <div class="index-row">
      <span class="k">Status</span>
      <span class="dots"></span>
      <span class="v">Collecting data</span>
    </div>

    <div class="index-row">
      <span class="k">Launch</span>
      <span class="dots"></span>
      <span class="v">Coming soon</span>
    </div>
  </div>

  <div class="legend" aria-label="Planned data layers">
    <span class="legend-item"><span class="swatch c1"></span>Access to care</span>
    <span class="legend-item"><span class="swatch c2"></span>Demographics</span>
    <span class="legend-item"><span class="swatch c3"></span>Health system performance</span>
    <span class="legend-item"><span class="swatch c4"></span>Historical data</span>
  </div>

</main>

</body>
</html>
