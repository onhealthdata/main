<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Don Valley East & Scarborough Centre — Dissemination Areas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { width: 100%; height: 100%; }
  .info-box {
    position: absolute;
    top: 12px;
    left: 50px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 10px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    font-size: 14px;
    max-width: 280px;
  }
  .info-box h1 {
    font-size: 15px;
    margin: 0 0 4px 0;
  }
  .info-box p {
    margin: 0;
    color: #444;
    font-size: 12px;
  }
  .leaflet-popup-content b {
    display: block;
    margin-bottom: 2px;
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="info-box">
  <h1>Dissemination Areas</h1>
  <p>Don Valley East &amp; Scarborough Centre riding boundaries · 2021 Census</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="da_data.js"></script>
<script>
  const map = L.map('map').setView([43.742, -79.296], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  const baseStyle = {
    fillColor: '#3186cc',
    weight: 1.5,
    opacity: 1,
    color: '#1a5276',
    fillOpacity: 0.35
  };

  const hoverStyle = {
    weight: 3,
    color: '#f39c12',
    fillOpacity: 0.55
  };

  function highlightFeature(e) {
    e.target.setStyle(hoverStyle);
    e.target.bringToFront();
  }

  function resetHighlight(e) {
    // Reset explicitly to the known base style rather than relying on
    // Leaflet's resetStyle, which can miss layers if mouseout doesn't
    // fire cleanly (fast cursor movement, edge transitions, etc.)
    e.target.setStyle(baseStyle);
  }

  function onEachFeature(feature, layer) {
    const props = feature.properties;
    const popupContent = `<b>DA ${props.DAUID}</b>` +
      `Dissemination Area ID: ${props.DAUID}<br>` +
      `Land area: ${props.LANDAREA} km²`;
    layer.bindPopup(popupContent);

    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight,
      click: function (e) {
        layer.openPopup();
      }
    });
  }

  // Safety net: if the mouse leaves the map entirely (e.g. onto the
  // info box or browser chrome) without a mouseout ever firing on the
  // last-hovered polygon, reset every layer back to base style.
  document.getElementById('map').addEventListener('mouseleave', function () {
    daLayer.eachLayer(function (layer) {
      layer.setStyle(baseStyle);
    });
  });

  const daLayer = L.geoJSON(daData, {
    style: baseStyle,
    onEachFeature: onEachFeature
  }).addTo(map);

  map.fitBounds(daLayer.getBounds(), { padding: [20, 20] });
</script>

</body>
</html>
